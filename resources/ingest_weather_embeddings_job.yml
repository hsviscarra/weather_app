# Databricks Workflow that runs notebooks/ingest_weather_embeddings.py on a
# schedule. The notebook is a plain psycopg2 script (no Spark) - it reads
# whatever's already in weather_documents (populated separately via the
# Flask app's POST /weather/sync), chunks + embeds the new rows, and writes
# them into weather_embeddings.
#
# No job_clusters/new_cluster block - this task needs no Spark, so it runs
# on serverless job compute by default. If your workspace doesn't have
# serverless jobs enabled, add a job_cluster_key + new_cluster block back in
# (any small general-purpose cluster works - the notebook doesn't touch
# Spark either way).
#
# Deploy: databricks bundle deploy -t dev
# Run once manually: databricks bundle run ingest_weather_embeddings_job -t dev

resources:
  jobs:
    ingest_weather_embeddings_job:
      name: "[${bundle.target}] Ingest Weather Embeddings"

      # Runs hourly - alerts and forecasts change much faster than daily
      # news, so this is scheduled tighter than the day-2 stock-news job.
      schedule:
        quartz_cron_expression: "0 0 * * * ?"
        timezone_id: "UTC"
        pause_status: PAUSED  # flip to UNPAUSED once you've validated a manual run

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}

      max_concurrent_runs: 1

      tasks:
        - task_key: ingest_weather_embeddings
          notebook_task:
            notebook_path: ../notebooks/ingest_weather_embeddings.py
            base_parameters:
              documents_table_name: "weather_documents"
              embeddings_table_name: "weather_embeddings"
              embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
              model_cache_path: "/Volumes/hv_external_catalog/weather_schema/ml_models"
              chunk_size: "800"
              chunk_overlap: "100"
              batch_size: "100"
