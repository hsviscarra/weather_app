# Databricks Workflow that runs notebooks/ingest_weather_embeddings.py on a
# schedule. The notebook queries the `weather_watchlist` table for tracked
# locations, fetches active alerts + forecast periods for those locations
# directly from the free, keyless NWS API, and turns the resulting documents
# into vector embeddings for the context-engineering course's RAG exercises.
#
# Deploy: databricks bundle deploy -t dev
# Run once manually: databricks bundle run ingest_weather_embeddings_job -t dev

resources:
  jobs:
    ingest_weather_embeddings_job:
      name: "[${bundle.target}] Ingest Weather Embeddings"

      # Runs hourly - alerts and forecasts change much faster than daily
      # news, so this is scheduled tighter than the day-2 stock-news job.
      schedule:
        quartz_cron_expression: "0 0 * * * ?"
        timezone_id: "UTC"
        pause_status: PAUSED  # flip to UNPAUSED once you've validated a manual run

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}

      max_concurrent_runs: 1

      job_clusters:
        - job_cluster_key: default_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 2
            data_security_mode: SINGLE_USER

      tasks:
        - task_key: ingest_weather_embeddings
          job_cluster_key: default_cluster
          notebook_task:
            notebook_path: ../notebooks/ingest_weather_embeddings.py
            base_parameters:
              watchlist_table_name: "weather_watchlist"
              documents_table_name: "weather_documents"
              embeddings_table_name: "weather_documents_embeddings"
              embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
              nws_user_agent: "(weather_app, you@example.com)"
