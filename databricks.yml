# Databricks Asset Bundle config for this project.
# Deploy with: databricks bundle deploy -t dev   (or -t prod)
# This wires up the weather-embeddings notebook as a scheduled Workflow
# (see resources/ingest_weather_embeddings_job.yml).

bundle:
  name: weather_app

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://<your-workspace-instance>.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://<your-workspace-instance>.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
